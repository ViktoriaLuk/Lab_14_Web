<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вхід</title>
</head>
<body>
    <h1>Вхід</h1>
    <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required><br><br>
        <input type="password" id="password" placeholder="Пароль" required><br><br>
        <button type="submit">Увійти</button>
    </form>
    
    <h3 id="message" style="color: rgb(255, 0, 102); margin-top: 15px;"></h3>
    <p><a href="/register.html">Немає акаунту? Зареєструватися</a></p>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageEl = document.getElementById('message');

            const body = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            const data = await response.json();

            if (!response.ok) {
                messageEl.style.color = 'red';
                messageEl.textContent = '❌ ' + (data.message || 'Невірний email або пароль');
                return;
            }

            if (data.token) {
                localStorage.setItem('token', data.token);
                messageEl.style.color = 'green';
                messageEl.textContent = '✅ Вхід успішний! Перехід на головну сторінку...';
                setTimeout(() => window.location.href = '/index.html', 2000);
            } else {
                messageEl.style.color = 'red';
                messageEl.textContent = '❌ Токен не знайдено у відповіді сервера';
            }
        });
    </script>
</body>
</html>
