<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація</title>
</head>
<body>
    <h1>Реєстрація</h1>
    <form id="registerForm">
        <input type="text" id="name" placeholder="Ім'я" required><br><br>
        <input type="email" id="email" placeholder="Email" required><br><br>
        <input type="password" id="password" placeholder="Пароль (мін. 8 симв.)" required><br><br>
        <input type="password" id="confirmPassword" placeholder="Підтвердження пароля" required><br><br>
        <button type="submit">Зареєструватися</button>
    </form>
    
    <h3 id="message" style="color: rgb(255, 0, 98); margin-top: 15px;"></h3>
    <p><a href="/login.html">Вже є акаунт? Увійти</a></p>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageEl = document.getElementById('message');
            
            const body = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                confirmPassword: document.getElementById('confirmPassword').value
            };

            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            const data = await response.json();

            if (!response.ok) {
                messageEl.style.color = 'red';
                messageEl.textContent = '❌ ' + (data.message || 'Помилка реєстрації');
                return;
            }

            localStorage.setItem('token', data.token);

            messageEl.style.color = 'green';
            messageEl.textContent = '✅ Реєстрація успішна! Перехід на головну сторінку...';
            
            setTimeout(() => window.location.href = '/index.html', 2000);
        });
    </script>
</body>
</html>
