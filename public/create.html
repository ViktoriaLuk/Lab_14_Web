<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Створення кімнати</title>
</head>
<body>
    <h1>Додати нову кімнату в базу</h1>
    <form id="createRoomForm">
        <input type="number" id="number" placeholder="Номер кімнати" required><br><br>
        
        <label for="type">Тип кімнати:</label>
        <select id="type" required>
            <option value="single">single</option>
            <option value="double">double</option>
            <option value="lux">lux</option>
        </select><br><br>
        
        <input type="number" id="price" placeholder="Ціна за добу (грн)" required><br><br>
        <input type="number" id="capacity" placeholder="Кількість місць" min="1" required><br><br>
        
        <button type="submit">Зберегти кімнату</button>
    </form>
    
    <p id="message" style="color: rgb(255, 0, 132);"></p>
    <p><a href="/index.html">← Повернутися до списку</a></p>

    <script>
        if (!localStorage.getItem('token')) {
            alert('Ця операція доступна лише для адміністраторів або авторизованих менеджерів готелю!');
            window.location.href = '/login.html';
        }

        const token = localStorage.getItem('token');

        document.getElementById('createRoomForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageEl = document.getElementById('message');

            const body = {
                number: Number(document.getElementById('number').value),
                type: document.getElementById('type').value,
                price: Number(document.getElementById('price').value),
                capacity: Number(document.getElementById('capacity').value)
            };

            const response = await fetch('/api/rooms', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(body)
            });

            const data = await response.json();

            if (!response.ok) {
                messageEl.style.color = 'red';
                messageEl.textContent = '❌ ' + (data.message || 'Помилка при створенні');
                return;
            }

            messageEl.style.color = 'green';
            messageEl.textContent = '✅ Кімнату успішно додано!';
            setTimeout(() => window.location.href = '/index.html', 1200);
        });
    </script>
</body>
</html>
